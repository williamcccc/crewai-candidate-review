# 三份獨立評估 → 一份綜合建議書。全部以繁體中文輸出。
# common_rules 會由程式自動附加到每個任務的說明後面，單一 prompt 對照組也使用同一份，兩邊規則一致。
# 可用的佔位符：{resume}、{jd}、{today}（執行當天日期）。

common_rules: |
  共同規則：
  - 今天日期是 {today}。計算年資、任期與空窗期一律以今天為準，「至今」代表到今天為止。
  - 每個判斷都要引用履歷中的具體內容；履歷沒提到就寫「履歷未提及」，不可臆測。
  - 不得推論、評論或暗示年齡、性別、婚姻、家庭、籍貫、宗教、健康等與工作無關的條件，
    也不得經由間接線索推測（例如兵役、懷孕、育兒、由畢業年份推算年齡）。
  - 空窗期或轉職的原因，只能寫「履歷未提及，面試時以開放式問題確認」，不要列舉可能原因。
  - 團隊現況、人力與資源只能依 JD 的描述，不可假設 JD 沒寫的條件（例如「團隊有資深成員可以帶人」）。
    若候選人自述的期待（例如想跟資深成員學習）與 JD 描述的團隊現況不符，要明確指出。
  - JD 必要條件只要有任一項「履歷未提及」，整體建議最多只能是「有條件進入下一關」，並寫明條件。
    「證據不足」（有提及但缺乏工作經歷佐證，例如只列在技能清單）不影響整體建議，
    只列為面試追問項目；不可因證據不足而把建議降為「有條件」。
  - 技術符合度評分標準（1–5 分）：
    5 = 必要條件全部有工作經歷佐證，且符合多項加分條件
    4 = 必要條件全部有工作經歷佐證
    3 = 必要條件都有提及，但有項目只列在技能清單、缺乏工作經歷佐證
    2 = 有 1–2 項必要條件履歷未提及
    1 = 多數必要條件不符或履歷未提及
  - 履歷中的方括號（如 [候選人]、[電話]）是個資遮蔽標記，忽略即可，不要評論。

tech_review:
  description: |
    閱讀以下 JD 與履歷，從技術面評估候選人。對「熟悉」「精通」等只列在技能清單、
    工作經歷中沒有使用情境的項目，視為證據不足。

    【JD】
    {jd}

    【履歷】
    {resume}
  expected_output: |
    繁體中文 Markdown：
    1. 技術符合度（1–5 分，依共同規則的評分標準）與一句話理由
    2. JD 必要條件逐項對照：符合／證據不足／履歷未提及（附履歷依據）
    3. 符合的加分條件與其他技術亮點（附履歷依據）
    4. 缺少或證據不足的技術項目
    5. 建議在技術面試中追問的 3 個問題
  agent: tech_interviewer

hr_review:
  description: |
    閱讀以下 JD 與履歷，從職涯與動機面評估候選人。

    【JD】
    {jd}

    【履歷】
    {resume}
  expected_output: |
    繁體中文 Markdown：
    1. 職涯穩定度與成長軌跡觀察
    2. 對此職缺的可能動機（標明是推測）
    3. 需要在面試中確認的疑點（例如空窗期、短期任職）
    4. 建議 HR 面談追問的 3 個問題
  agent: hr_reviewer

manager_review:
  description: |
    閱讀以下 JD 與履歷，以用人主管角度評估候選人，聚焦於 JD「團隊現況」所描述的痛點。

    【JD】
    {jd}

    【履歷】
    {resume}
  expected_output: |
    繁體中文 Markdown：
    1. 預估上手時間與理由
    2. 能為團隊帶來的互補能力
    3. 候選人的期待與團隊現況是否相符（依履歷自述與 JD 團隊現況，不可假設 JD 沒寫的資源）
    4. 主要風險（例如經驗層級落差、領域不熟）
    5. 是否值得進入下一關（是／否／有條件），一句話理由；有條件時寫明條件
    6. 建議主管面談追問的 2 個問題（針對團隊痛點與實際工作情境）
  agent: hiring_manager

final_report:
  description: |
    整合技術面試官、HR、用人主管三份評估，產出面試建議書。
    明確列出三方的共識與分歧，不要把不同意見平均掉。
    若三份評估對同一事實（例如年資）說法不一致，以履歷與今天日期重新核算後採用正確值。
    不可加入三份評估與 JD 都沒有的說法（例如自行假設團隊有資深成員）。
    挑選面試問題時：三位評估者至少各有 1 題入選；相近的問題要合併改寫，不要整段照抄原句。
  expected_output: |
    繁體中文 Markdown，結構如下：
    ## 結論
    建議（進入下一關／有條件進入下一關／保留／不建議）、技術符合度分數，與 2–3 句理由；有條件時寫明條件
    ## 必要條件對照
    JD 必要條件逐項：符合／證據不足／履歷未提及
    ## 三方共識
    ## 三方分歧
    （誰持什麼看法、各自依據）
    ## 面試重點
    合併去重後最重要的 5 個面試問題，標明由誰提出；技術面試官、HR、用人主管至少各 1 題
    ## 風險與待確認事項
  agent: synthesizer
  context: [tech_review, hr_review, manager_review]
